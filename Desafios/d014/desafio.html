<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Parte 2</title>
</head>

<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
    }

    table {
        width: 500px;
        border-collapse: collapse;
    }

    thead {
        background-color: gray;
        border: 1px solid black;
    }

    thead th {
        padding: 10px;
        color: white;
        border: 1px solid black;
    }

    tbody {
        border: 1px solid black;
        text-align: center;
    }

    tbody th {
        background-color: gray;
        color: white;
        border: 1px solid black;
        padding: 10px;
    }

    tbody td {
        border: 1px solid black;
        padding: 10px;
    }
    .di{
        font-size: 1.2em;
        font-weight: bold;
        text-align: center;
    }
    .dife{
        text-align: left;
    }
    .tddiferente{
        text-align: left;
    }
</style>

<body>

    <table>

        <thead>
            <th>Área</th>
            <th>Disciplinas</th>
            <th colspan="2">Notas</th>

        <tbody>

            <tr>
                <td class="di" rowspan="5">Exatas</td>
            </tr>

            <tr>

                <td>0.0</td>
            </tr>

            <tr>

            <tr>
                <td class="tddiferente">Química</td>

            </tr>

            <tr>
                <td class="tddiferente">Biologia</td>
                <td>0.0</td>

                <td>0.0</td>
            </tr>

            <tr>
                 <th class="dife" colspan="4">Média de Exatas</th>
                 <th>0.0</th>
            </tr>

            <tr>
                <td class="di" rowspan="3">Humanas</td>
            </tr>

            <tr>
                <td class="tddiferente">História</td>
                <td>0.0</td>

                <td>0.0</td>
            </tr>

            <tr>
                <td class="tddiferente">Geografia</td>
                <td>0.0</td>

            <tr>
