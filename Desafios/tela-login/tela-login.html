<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"/>
    <link rel="stylesheet" href="estilos/tela-de-login.css">
</head>

<body>
    <section id="usuario">
        <div class="formulario">
            <h1>LOGIN</h1>
            <form action="login.php" method="post">
                <div class="login">
                    <span class="material-symbols-outlined">person</span>
                    <label for="login"></label>
                    <input type="text" name="login" id="login" required minlength="5" placeholder=" Usuário ou Email">
                </div>
                <div class="senha">
                    <span class="material-symbols-outlined">vpn_key</span>
                    <label for="senha"></label>
                    <input type="password" name="senha" id="senha" required minlength="8" placeholder=" Senha">
                </div>
                <div class="entrar">
                    <input class="entrar" type="submit" value="Entrar">
                </div>
                <a href="#">Esqueceu a senha?</a>
            </form>
        </div>
    </section>

</body>

</html>
