<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="estilos/tela-de-login.css">
</head>

<body>
    <section id="login">
        <div class="formulario">
            <h1>LOGIN</h1>
            <form action="login.php" method="post">
                <div class="usuario">
                    <img src="icons/usuário.png" alt="Usuário"></img>
                    <input type="text" name="usuario" id="usuario" required minlength="8" placeholder=" Usuário ou Email">
                </div>
                <div class="senha">
                    <label for="senha"> <img src="icons/senha.png" alt="Senha"></label>
                    <input type="password" name="senha" id="senha" required minlength="8" placeholder=" Senha">
                </div>
                <div class="enviar"><input type="submit" value="Enviar"></div>
            </form>
        </div>
    </section>

</body>

</html>
