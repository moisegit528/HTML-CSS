<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <link rel="stylesheet" href="tabela.css">
</head>
<body>

    <!--TR - Títulos -->>
    <!-- TD - DADOS -->>
    <!--Primeira linha -->>
    <h1>Minha Primeira Tabela</h1>
    <table>

        <tr> <!--Primeira linha -->>
            <td> A1 </td>
            <td> B1 </td>
            <td> C1 </td>
        </tr>

        <tr> <!--Segunda linha -->>
            <td> A2 </td>
            <td> B2 </td>
            <td class="numero"> C2</td>
        </tr>

        <tr> <!--Terceira linha -->>
            <td> A3 </td>
            <td> B3 </td>
            <td class="numero"> C3 </td>
        </tr>

        <tr> <!--Quarta linha -->>
            <td> A4 </td>
            <td> B4 </td>
            <td> C4 </td>
        </tr>
    </table>
</body>
</html>
