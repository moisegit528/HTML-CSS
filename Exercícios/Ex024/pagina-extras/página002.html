<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste</title>
</head>

<style>

    body{
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        background-color: beige;
    }
    caption{
        font-size: 1.3em;
        text-align: center;
        font-weight: bold;
        padding: 10px;
    }

    table{
        width: 500px;
        border-collapse: collapse;
    }
    
    th{
        font-weight: bold;
        border: 1px solid black;
        padding: 5px;
    }

    td{

    .co2{

    .co3{

    }

    .co4{

</style>

</style>

<body>
